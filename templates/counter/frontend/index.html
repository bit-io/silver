<div class="page">
    <div class="card">
        <h1>Licznik</h1>
        <p class="count" id="count">{{count}}</p>
        <div class="row">
            <button class="btn" on-click="decrement">−1</button>
            <button class="btn primary" on-click="increment">+1</button>
            <button class="btn ghost" id="reset">reset (JS)</button>
        </div>
        <p class="hint" id="hint">Skróty: strzałka ↑ / ↓, spacja = +1</p>
    </div>
</div>
